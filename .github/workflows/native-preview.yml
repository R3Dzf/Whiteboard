name: Inklume Native Preview
on:
  push:
    branches: [native-rewrite]
    paths:
      - 'native/**'
      - '.github/workflows/native-preview.yml'
  workflow_dispatch:
concurrency:
  group: inklume-native-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore native/Inklume.App/Inklume.App.csproj
      - name: Build Avalonia desktop app
        run: dotnet build native/Inklume.App/Inklume.App.csproj -c Release --no-restore
      - name: Run core smoke tests
        run: dotnet run --project native/Inklume.SmokeTests/Inklume.SmokeTests.csproj -c Release
      - name: Publish Windows self-contained preview
        run: dotnet publish native/Inklume.App/Inklume.App.csproj -c Release -r win-x64 --self-contained true -o dist/inklume-native
      - name: Upload Windows preview
        uses: actions/upload-artifact@v4
        with:
          name: Inklume-Native-win-x64-PREVIEW
          path: dist/inklume-native/
          retention-days: 14
